# Configuración del proyecto (Actividad 2 - Forecasting)
# Todo lo que puede cambiar (datos, modelo, MLflow) vive aquí.

datos:
  ruta: "data/ventas_retail.csv"

division:
  test_size: 0.2
  random_state: 42

modelo:
  tipo: "random_forest_regressor"
  parametros:
    n_estimators: 100
    max_depth: 2
    random_state: 42

mlflow:
  tracking_uri: "http://127.0.0.1:5000"
  experimento: "Forecasting_Ventas_Retail"
  nombre_run: "forecasting-training"

registro:
  nombre_modelo: "retail-forecasting-modelo"
  # Nota: Como predecimos ventas (regresión), usamos RMSE máximo permitido en lugar de AUC.
  # El modelo solo será "champion" si su RMSE es MENOR a este valor y menor al campeón actual.
  umbral_rmse: 6000000.0
  drift_threshold_p_value: 0.05   

inferencia:
  tamano_lote: 100            # Cuántos registros diarios se van a predecir
  carpeta_salida: "data/predicciones"

 