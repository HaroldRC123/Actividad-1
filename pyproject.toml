[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_activity_1"
version = "0.1.0"
description = "Pipeline de ML con Prefect y MLflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.1",
    "prefect>=2.14.4",
    "mlflow>=2.7.1"
]